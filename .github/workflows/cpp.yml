name: C++
on: [push, pull_request]

jobs:
  msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure latest MSVC
        run: cmake --preset msvc
      - name: Build
        run: cmake --build --preset release --parallel
      - name: Test
        run: ctest --preset release
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare all algorithms against upstream v1.0.0
        shell: pwsh
        run: |
          git fetch https://github.com/XuanRikka/tlg-rs.git 10373b87fd0d24fa38311b1b59758c7727624194
          if ($LASTEXITCODE -ne 0) { throw 'upstream fetch failed' }
          New-Item -ItemType Directory -Force build/oracle/latest | Out-Null
          git archive 10373b87fd0d24fa38311b1b59758c7727624194 --output=build/oracle/latest.tar
          if ($LASTEXITCODE -ne 0) { throw 'upstream archive failed' }
          tar -xf build/oracle/latest.tar -C build/oracle/latest
          if ($LASTEXITCODE -ne 0) { throw 'upstream extraction failed' }
          ./tests/interop/run.ps1 -RustTree build/oracle/latest
          ./tests/interop/algorithms.ps1 -RustOracle build/oracle/latest/target/release/examples/interop.exe
          ./tests/interop/images.ps1 -RustTree build/oracle/latest
      - name: Configure address sanitizer
        run: cmake --preset msvc-asan
      - name: Build address sanitizer
        run: cmake --build --preset asan --parallel
      - name: Test address sanitizer
        shell: pwsh
        run: |
          $vsRoot = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $tools = Get-ChildItem "$vsRoot\VC\Tools\MSVC" | Sort-Object Name -Descending | Select-Object -First 1
          $env:PATH = "$($tools.FullName)\bin\Hostx64\x64;$env:PATH"
          ctest --preset asan
  gcc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure with GCC and sanitizers
        run: cmake -S . -B build/gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Debug -DTLG_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build/gcc --parallel
      - name: Test
        run: ctest --test-dir build/gcc --output-on-failure
